<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בונה הפעולות</title>
<style>
:root{--bg:#f6f4ec;--card:#fff;--tx:#1f2a1f;--mu:#5d6b5d;--ac:#2f6b3a;--ac2:#e9f2ea;--bd:#d9ddd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131a14;--card:#1c261d;--tx:#eaf0ea;--mu:#9fb09f;--ac:#6fc07d;--ac2:#243427;--bd:#2f3d31}}
:root[data-theme="dark"]{--bg:#131a14;--card:#1c261d;--tx:#eaf0ea;--mu:#9fb09f;--ac:#6fc07d;--ac2:#243427;--bd:#2f3d31}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:8px 0 2px}
.sub{color:var(--mu);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:600;margin:12px 0 4px}
select,input,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 18px;background:var(--ac);color:#fff;width:100%;margin-top:16px;min-height:48px}
button.sec{background:var(--ac2);color:var(--ac);margin-top:10px}
button:disabled{opacity:.6}
#out h2{font-size:1.25rem;color:var(--ac);border-bottom:2px solid var(--ac2);padding-bottom:4px;margin:20px 0 8px}
#out h3{font-size:1.05rem;margin:14px 0 4px}
#out ul{padding-inline-start:22px;margin:6px 0}
#out p{margin:6px 0}
.err{color:#b3261e;font-weight:600}
.note{font-size:.85rem;color:var(--mu);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{width:auto;margin:0;padding:8px 14px;min-height:40px;border-radius:20px;font-weight:600;background:var(--ac2);color:var(--ac)}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:600}
.chk input{width:24px;height:24px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btns button{margin:0}
.rf{display:flex;gap:8px;margin-top:12px}
.rf input{flex:1}
.rf button{width:auto;margin:0}
.warn{background:#fff4d6;color:#6b4e00;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:.9rem}
.hrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.hrow span{flex:1}
.mini{width:auto;margin:0;padding:8px 12px;min-height:40px;font-size:.9rem}
@media print{main>*:not(#res){display:none}#res .btns,#res .rf,#chk{display:none}body{background:#fff;color:#000}.card{border:0}}
</style>
</head>
<body>
<main>
<h1>🏕️ בונה הפעולות</h1>
<p class="sub">ספרו מה אתם צריכים, והבינה המלאכותית תבנה לכם פעולה מוכנה במבנה הקלאסי: פתיחה, גוף וסיכום.</p>

<div class="card">
<label for="mv">תנועה</label>
<select id="mv"><option>צופים</option><option>הנוער העובד והלומד</option><option>בני עקיבא</option><option>השומר הצעיר</option><option>המחנות העולים</option><option>אחר / כללי</option></select>
<div class="row">
<div><label for="age">שכבת גיל</label>
<select id="age"><option>כיתות ב׳–ג׳</option><option>כיתות ד׳–ה׳</option><option>כיתות ו׳–ז׳</option><option selected>כיתות ח׳–ט׳</option><option>כיתות י׳–י״ב</option></select></div>
<div><label for="dur">משך (דקות)</label><input id="dur" type="number" value="60" min="15" max="180" inputmode="numeric"></div>
</div>
<div class="row">
<div><label for="grp">מספר חניכים</label><input id="grp" type="number" value="15" min="2" max="100" inputmode="numeric"></div>
<div><label for="set">מקום</label>
<select id="set"><option>בסניף</option><option>בחוץ</option><option>בזום</option><option>בשבת (ללא אלקטרוניקה)</option></select></div>
</div>
<label for="top">נושא או מטרה</label>
<input id="top" placeholder="למשל: אחריות, אמון, עבודת צוות, פעולת פתיחה">
<div class="chips" id="chips"></div>
<label for="ext">בקשות מיוחדות</label>
<textarea id="ext" placeholder="למשל: לכלול שיר מסוים, משחק תפיסה בפתיחה, הרבה משחקים ומעט דיון"></textarea>
<label for="sty">אופי הפעולה</label>
<select id="sty"><option value="bal">מאוזן: משחק ותוכן</option><option value="games">יותר משחקים</option><option value="talk">יותר דיון ושיח</option></select>
<label class="chk"><input type="checkbox" id="ng"> בלי ציוד מיוחד</label>
<button id="go">בנו לי פעולה ✨</button>
</div>

<div class="card" id="res" hidden>
<div id="out"></div>
<p class="warn" id="chk" hidden></p>
<div class="btns">
<button class="sec" id="cp">העתקה</button>
<button class="sec" id="wa">שיתוף</button>
<button class="sec" id="dl">הורדה כקובץ</button>
<button class="sec" id="pr">הדפסה</button>
</div>
<div class="rf"><input id="rf" placeholder="למשל: הוסיפו עוד שאלות לדיון"><button class="sec" id="rfb">שנו לי</button></div>
<button class="sec" id="again">עוד גרסה אחרת</button>
</div>
<div class="card" id="hist" hidden><strong>הפעולות שלי (נשמרות במכשיר הזה)</strong><div id="hl"></div></div>
<p class="note">הפעולות נוצרות על ידי בינה מלאכותית. תמיד כדאי לעבור עליהן ולהתאים לקבוצה שלכם.</p>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var last="",busy=false;

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
function render(md){
  var lines=md.split("\n"),h="",ul=false;
  lines.forEach(function(l){
    var t=l.trim();
    var li=/^[-*•]\s+(.*)/.exec(t);
    if(li){if(!ul){h+="<ul>";ul=true}h+="<li>"+inline(li[1])+"</li>";return}
    if(ul){h+="</ul>";ul=false}
    if(!t)return;
    if(/^##\s/.test(t))h+="<h2>"+inline(t.replace(/^#+\s*/,""))+"</h2>";
    else if(/^#\s/.test(t))h+="<h2>"+inline(t.replace(/^#+\s*/,""))+"</h2>";
    else if(/^###\s/.test(t))h+="<h3>"+inline(t.replace(/^#+\s*/,""))+"</h3>";
    else h+="<p>"+inline(t)+"</p>";
  });
  if(ul)h+="</ul>";
  return h;
}

async function gen(variant,refine){
  if(busy)return;
  busy=true;$("go").disabled=true;$("again").disabled=true;$("rfb").disabled=true;
  var prevText=last;
  $("res").hidden=false;$("chk").hidden=true;$("out").innerHTML="<p>בונה פעולה... אפשר לראות אותה נכתבת</p>";
  $("res").scrollIntoView({behavior:"smooth"});
  try{
    var body={mv:$("mv").value,age:$("age").value,dur:$("dur").value,grp:$("grp").value,set:$("set").value,top:$("top").value,ext:$("ext").value,sty:$("sty").value,ng:$("ng").checked,variant:!!variant};
    if(refine){body.refine=refine;body.prev=prevText.slice(0,12000)}
    var acc="";
    for(var t=0;t<2&&!acc.trim();t++){
      var r=await fetch("/api/peula",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      var ct=r.headers.get("content-type")||"";
      if(ct.indexOf("application/json")>-1){var d=await r.json();throw new Error(d.error||"שגיאה, נסו שוב.");}
      if(!r.ok||!r.body)throw new Error("השרת לא ענה כמו שצריך ("+r.status+"). נסו שוב בעוד רגע.");
      var rd=r.body.getReader(),dec=new TextDecoder();acc="";
      for(;;){var x=await rd.read();if(x.done)break;acc+=dec.decode(x.value,{stream:true});last=acc;$("out").innerHTML=render(acc);}
    }
    if(!acc.trim())throw new Error("לא התקבלה תשובה, נסו שוב.");
    addHist(acc);checkTimes(acc,parseInt($("dur").value,10)||60);
  }catch(e){
    var msg='<p class="err">'+esc(e.message||"משהו השתבש, נסו שוב.")+'</p>';
    if(refine&&prevText){last=prevText;$("out").innerHTML=render(prevText)+msg}else $("out").innerHTML=msg;
  }
  busy=false;$("go").disabled=false;$("again").disabled=false;$("rfb").disabled=false;
}

/* ---------- פונקציות חדשות ---------- */
var HK="peulot_v1";
function hget(){try{return JSON.parse(localStorage.getItem(HK)||"[]")}catch(e){return []}}
function hset(a){try{localStorage.setItem(HK,JSON.stringify(a.slice(0,30)))}catch(e){}}
function titleOf(md){var m=/^#\s*(.+)$/m.exec(md);return m?m[1].replace(/\*/g,"").trim():($("top").value||"פעולה")}
function plain(md){return md.replace(/\*\*/g,"").replace(/^#+\s*/gm,"")}
function addHist(md){var a=hget();a.unshift({t:titleOf(md),d:new Date().toLocaleDateString("he-IL"),m:md});hset(a);drawHist()}
function drawHist(){
  var a=hget(),box=$("hl");$("hist").hidden=!a.length;box.textContent="";
  a.forEach(function(it,i){
    var row=document.createElement("div");row.className="hrow";
    var sp=document.createElement("span");sp.textContent=it.t+" · "+it.d;
    var o=document.createElement("button");o.className="sec mini";o.textContent="פתיחה";
    o.onclick=function(){last=it.m;$("res").hidden=false;$("chk").hidden=true;$("out").innerHTML=render(last);$("res").scrollIntoView({behavior:"smooth"})};
    var x=document.createElement("button");x.className="sec mini";x.textContent="מחיקה";
    x.onclick=function(){var b=hget();b.splice(i,1);hset(b);drawHist()};
    row.appendChild(sp);row.appendChild(o);row.appendChild(x);box.appendChild(row);
  });
}
function checkTimes(md,dur){
  var sum=0,found=0;
  md.split("\n").forEach(function(l){
    l=l.trim();if(!/^##\s/.test(l))return;
    var m=/\(([^)]*)\)\s*$/.exec(l);if(!m)return;
    var hh=/(\d+)\s*שעה/.exec(m[1]),mm=/(\d+)\s*דקות/.exec(m[1]);
    if(!hh&&!mm)return;
    sum+=(hh?60*(+hh[1]):0)+(mm?+mm[1]:0);found++;
  });
  var el=$("chk");
  if(found&&sum!==dur){el.textContent="שימו לב: סכום הזמנים בפעולה הוא "+sum+" דקות ולא "+dur+". אפשר לכתוב למטה “תקנו את הזמנים” וללחוץ על “שנו לי”.";el.hidden=false}
  else el.hidden=true;
}
['אחריות','אמון','עבודת צוות','גבולות','שייכות לקבוצה','התמודדות עם פחד','חברות','ערבות הדדית','סבלנות','נתינה'].forEach(function(t){
  var c=document.createElement("button");c.type="button";c.className="chip";c.textContent=t;
  c.onclick=function(){$("top").value=t};$("chips").appendChild(c);
});
$("wa").onclick=function(){
  if(!last)return;var t=plain(last).slice(0,3500);
  if(navigator.share){navigator.share({text:t}).catch(function(){})}
  else window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
};
$("dl").onclick=function(){
  if(!last)return;
  var b=new Blob(["\ufeff"+plain(last)],{type:"text/plain;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=titleOf(last).slice(0,40)+".txt";
  document.body.appendChild(a);a.click();a.remove();
};
$("pr").onclick=function(){window.print()};
$("rfb").onclick=function(){var v=$("rf").value.trim();if(!v||!last)return;$("rf").value="";gen(false,v)};
drawHist();

$("go").onclick=function(){gen(false)};
$("again").onclick=function(){gen(true)};
$("cp").onclick=async function(){
  try{await navigator.clipboard.writeText(last);$("cp").textContent="הועתק ✓"}catch(e){$("cp").textContent="ההעתקה לא נתמכת, סמנו ידנית"}
  setTimeout(function(){$("cp").textContent="העתקה"},2000);
};
})();
</script>
</body>
</html>
